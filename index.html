<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>...</title>

<style>
body{
background:black;
color:white;
font-family:"Times New Roman", serif;
font-size:22px;
line-height:1.8;
padding:40px;
}

.text{
opacity:0;
transform:translateY(30px);
transition:all 1.5s ease;
margin-bottom:25px;
}

.show{
opacity:1;
transform:translateY(0);
}

button{
position:fixed;
top:20px;
right:20px;
background:white;
color:black;
border:none;
padding:10px 18px;
font-size:16px;
cursor:pointer;
border-radius:20px;
}
</style>
</head>

<body>

<button onclick="playMusic()">Play Music 🎵</button>

<audio id="song" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<div id="container"></div>

<script>

function playMusic(){
document.getElementById("song").play();
}

const texts = [
"ada masa ketika apa yg terjadi di antara kita meninggalkan luka yang bahkan i didn’t understand how to fix it.",

"it took me a while to realize bahwa sebenernya orang yang terluka kadang tanpa sadar melukai oranglain juga, dan itu wajar jika terjadi.",

"so i dont want to blame u, nor to reopen anything",

"as a human who can make a false.. i dont hate u. but i hate u as a man who leave me alone while we get broke.",

"i just hope u know tht whtever u were fight with ur life, u didn’t hv to face it alone",

"but sincerely, i hope life becomes kinder to u, n tht someday u can find peace within urself.",

"- wishing ur the best, from afar🩵"
];

let index = 0;

document.addEventListener("click", () => {

if(index < texts.length){

let p = document.createElement("p");
p.className="text";
p.innerText=texts[index];

document.getElementById("container").appendChild(p);

setTimeout(()=>{
p.classList.add("show");
},100);

index++;
}

});

</script>

</body>
</html>
